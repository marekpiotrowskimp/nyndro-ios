<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient - calm blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B8FB9"/>
      <stop offset="100%" style="stop-color:#3A6B8C"/>
    </linearGradient>
    
    <!-- Gold gradient for spire and details -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#F0C040"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
    
    <!-- White/cream gradient for main dome -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F5F0E6"/>
    </linearGradient>
    
    <!-- Darker shade for harmika -->
    <linearGradient id="harmikaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EFE6"/>
      <stop offset="100%" style="stop-color:#E8DED0"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="512" cy="512" r="512" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glow -->
  <circle cx="512" cy="512" r="460" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>
  
  <!-- STUPA - Tibetan Boudhanath style -->
  <g transform="translate(512, 512)">
    
    <!-- Base platform (3 tiers) -->
    <rect x="-280" y="220" width="560" height="40" rx="4" fill="url(#whiteGrad)" opacity="0.9"/>
    <rect x="-240" y="180" width="480" height="45" rx="4" fill="url(#whiteGrad)" opacity="0.95"/>
    <rect x="-200" y="140" width="400" height="45" rx="4" fill="url(#whiteGrad)"/>
    
    <!-- Main dome (anda) - large hemispherical shape -->
    <ellipse cx="0" cy="60" rx="180" ry="120" fill="url(#whiteGrad)"/>
    
    <!-- Harmika (square tower with Buddha eyes) -->
    <rect x="-70" y="-100" width="140" height="100" fill="url(#harmikaGrad)"/>
    
    <!-- Buddha Eyes on harmika - front face representation -->
    <!-- Left eye -->
    <ellipse cx="-30" cy="-60" rx="18" ry="12" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="-30" cy="-60" r="6" fill="url(#goldGrad)"/>
    
    <!-- Right eye -->
    <ellipse cx="30" cy="-60" rx="18" ry="12" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="30" cy="-60" r="6" fill="url(#goldGrad)"/>
    
    <!-- Nose (Nepali numeral 1 - representing unity) -->
    <path d="M 0 -45 Q 5 -30 0 -20 Q -5 -30 0 -45" fill="url(#goldGrad)"/>
    
    <!-- Third eye dot -->
    <circle cx="0" cy="-80" r="5" fill="url(#goldGrad)"/>
    
    <!-- 13-tiered spire (representing path to enlightenment) -->
    <g transform="translate(0, -100)">
      <!-- Spire tiers - getting smaller as they go up -->
      <rect x="-50" y="-20" width="100" height="15" rx="2" fill="url(#goldGrad)"/>
      <rect x="-45" y="-35" width="90" height="12" rx="2" fill="url(#goldGrad)"/>
      <rect x="-40" y="-47" width="80" height="10" rx="2" fill="url(#goldGrad)"/>
      <rect x="-35" y="-57" width="70" height="9" rx="2" fill="url(#goldGrad)"/>
      <rect x="-30" y="-66" width="60" height="8" rx="2" fill="url(#goldGrad)"/>
      <rect x="-26" y="-74" width="52" height="7" rx="2" fill="url(#goldGrad)"/>
      <rect x="-22" y="-81" width="44" height="6" rx="2" fill="url(#goldGrad)"/>
      <rect x="-18" y="-87" width="36" height="5" rx="2" fill="url(#goldGrad)"/>
      <rect x="-15" y="-92" width="30" height="4" rx="2" fill="url(#goldGrad)"/>
      <rect x="-12" y="-96" width="24" height="4" rx="2" fill="url(#goldGrad)"/>
      <rect x="-9" y="-100" width="18" height="3" rx="1" fill="url(#goldGrad)"/>
      <rect x="-7" y="-103" width="14" height="3" rx="1" fill="url(#goldGrad)"/>
      <rect x="-5" y="-106" width="10" height="3" rx="1" fill="url(#goldGrad)"/>
      
      <!-- Parasol/umbrella at top -->
      <ellipse cx="0" cy="-115" rx="25" ry="8" fill="url(#goldGrad)"/>
      
      <!-- Pinnacle/finial -->
      <circle cx="0" cy="-130" r="12" fill="url(#goldGrad)"/>
      <path d="M 0 -145 L -6 -130 L 6 -130 Z" fill="url(#goldGrad)"/>
    </g>
    
    <!-- Prayer flags suggestion (subtle lines) -->
    <line x1="-70" y1="-95" x2="-180" y2="-40" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
    <line x1="70" y1="-95" x2="180" y2="-40" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Small decorative elements on dome -->
    <circle cx="-120" cy="80" r="8" fill="url(#goldGrad)" opacity="0.6"/>
    <circle cx="120" cy="80" r="8" fill="url(#goldGrad)" opacity="0.6"/>
    <circle cx="-80" cy="120" r="6" fill="url(#goldGrad)" opacity="0.5"/>
    <circle cx="80" cy="120" r="6" fill="url(#goldGrad)" opacity="0.5"/>
    
  </g>
</svg>
