name: Nyndro
options:
  bundleIdPrefix: com.marek.piotrowski
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: JMMW48F6X4
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en

targets:
  Nyndro:
    type: application
    platform: iOS
    sources:
      - path: Nyndro
        excludes:
          - "Resources/**"
      - path: Nyndro/Resources/Assets.xcassets
      - path: Nyndro/Resources/PredefinedPractices.json
      - path: Nyndro/Resources/Sounds
        type: folder
    preBuildScripts:
      - name: Validate Localizations
        script: |
          if [ -f "${SRCROOT}/Scripts/validate_localizations.sh" ]; then
            bash "${SRCROOT}/Scripts/validate_localizations.sh"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marek.piotrowski.nyndro
        INFOPLIST_KEY_CFBundleDisplayName: Nyndro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES

  NyndroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NyndroTests
    dependencies:
      - target: Nyndro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marek.piotrowski.nyndro.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
